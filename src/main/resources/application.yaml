server:
  port: ${SERVER_PORT:8085}
  servlet:
    context-path: /
    session:
      timeout: 3600 # redefine default 30m by 1 hour

info:
  app:
    name: ti-ai-orchestrator-api
    version: '@project.version@'

http:
  client:
    connect-timeout: ${HTTP_CLIENT_CONNECT_TIMEOUT:5000}
    read-timeout: ${HTTP_CLIENT_READ_TIMEOUT:120000}

spring:
  application:
    name: ${info.app.name}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
      resolve-lazily: false
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://${OKTA_DOMAIN}/
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: assistant
        hbm2ddl:
          auto: none
          jdbc:
            batch_size: 30
    hibernate:
      # turn off the hibernate auto-creation of the tables from the entity objects
      ddl-auto: none
    open-in-view: false
  datasource:
    hikari:
      minimum-idle: 5
      connection-timeout: 50000    # 60s (don’t let threads hang for 5 minutes)
      leak-detection-threshold: 20000 # 20s, temporary during investigation
      max-lifetime: 1800000        # 30m default-ish, keep explicit
      idle-timeout: 600000         # 10m
    url: ${ASSISTANT_DB_URL}
    driverClassName: org.postgresql.Driver
    username: ${ASSISTANT_USER}
    password: ${ASSISTANT_PASSWORD}
  data:
    redis:
      host: ${MEMORY_PROMPT_REDIS_CACHE_HOST}
      port: ${MEMORY_PROMPT_REDIS_CACHE_PORT:6379}
  ai:
    openai:
      api-key: ${OPEN_AI_API_KEY}
      base-url: ${OPEN_AI_ENDPOINT:https://ai-proxy.lab.epam.com}
      chat:
        completions-path: "${OPEN_AI_COMPLETIONS_PATH:/openai/deployments/gpt-chat-latest-reasoning/chat/completions}"
        model: "${CHAT_MODEL:gpt-chat-latest-reasoning}" # gpt-5-2025-08-07-reasoning  anthropic.claude-sonnet-5
        base-url: ${OPEN_AI_ENDPOINT:https://ai-proxy.lab.epam.com}
        embeddings-path: ${EMBEDDINGS_PATH:/openai/deployments/text-embedding-ada-002/embeddings}


conversation:
  window-size: ${CONVERSATION_WINDOW_SIZE:5}            # recent turns to keep in sliding window
  session-time-out: ${CONVERSATION_SESSION_TIMEOUT:86400}       # clear history after inactivity

api:
  text-to-sql:
    base-url: "${SQL_AGENT_API:http://localhost:8088}"
    search-result: "${api.text-to-sql.base-url}/api/v1/docs?conversationId=<UUID>"
  document:
    base-url: "${DOCUMENT_AGENT_API:http://localhost:8086}"
    search-result: "${api.document.base-url}/api/v1/docs?conversationId=<UUID>"
    load-url: ${api.document.base-url}/api/v1/load-url


group:
  admin: ${ADMINS:admin@example.com}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,zipkin
  endpoint:
    prometheus:
      access: read_only
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      zipkin:
        enabled: true
        endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  level:
    com.wk.ti: debug
    org.springframework: info
  # Enable Native JSON Structured Logging (Spring Boot 3.4+)
  structured:
    format:
      console: ecs # Emits logs in ECS JSON format containing service, traceId, spanId

ms:
  cors:
    allowed-origins: "${SWAGGER_ALLOWED_ORIGINS:http://localhost:8080}"

link:
  hello:
    kb: http://localhost

agent:
  timeout:
    main-seconds: ${ORCHESTRATOR_TIMEOUT_SECONDS:300}
    per-agent-seconds: ${AGENT_TIMEOUT_SECONDS:180}
  fallback:
    sleep-seconds: 30
    timeout-seconds: 120

app:
  chat-history:
    days: 30
  sse:
    timeout: 5 # min - compatible with AI Orchestrator timeout
    threadpool:
      core-size: 40
      max-size: 120
      queue-capacity: 200

springdoc:
  api-docs:
    path: /v3/api-docs

